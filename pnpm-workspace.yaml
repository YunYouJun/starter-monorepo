ignoreWorkspaceRootCheck: true

minimumReleaseAge: 1440
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
allowBuilds:
  esbuild: true
  simple-git-hooks: true

packages:
  - apps/*
  - playground
  - docs
  - packages/*
  - examples/*
overrides:
  esbuild: ^0.28.1
  nanoid@<3.3.18: 3.3.18
catalog:
  '@antfu/eslint-config': ^9.3.0
  '@antfu/ni': ^30.5.0
  '@antfu/utils': ^9.3.0
  '@iconify-json/svg-spinners': ^1.2.4
  '@shikijs/vitepress-twoslash': ^4.4.3
  '@types/node': ^26.4.0
  '@unocss/reset': ^66.8.1
  '@vueuse/core': ^14.4.0
  '@yunyoujun/docs': ^0.1.14
  bumpp: ^12.2.2
  eslint: ^10.9.1
  floating-vue: ^5.2.2
  lint-staged: ^17.4.1
  pinia: ^4.0.3
  publint: ^0.3.24
  simple-git-hooks: ^2.14.0
  tsdown: ^0.22.14
  tsx: ^4.23.13
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.13.0
  typedoc-vitepress-theme: ^1.1.3
  typescript: ^6.0.3
  unocss: ^66.8.1
  unplugin-vue-components: ^32.1.0
  vite: ^8.2.2
  vite-plugin-vue-devtools: ^8.2.1
  vitepress: ^2.0.0-alpha.19
  vitepress-plugin-group-icons: ^1.7.6
  vitest: ^4.1.11
  vue: ^3.5.42
