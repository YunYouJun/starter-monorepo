ignoreWorkspaceRootCheck: true

minimumReleaseAge: 1440
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
allowBuilds:
  esbuild: true
  simple-git-hooks: true

packages:
  - apps/*
  - playground
  - docs
  - packages/*
  - examples/*
overrides:
  esbuild: ^0.28.1
catalog:
  '@antfu/eslint-config': ^9.3.0
  '@antfu/ni': ^30.5.0
  '@antfu/utils': ^9.3.0
  '@iconify-json/svg-spinners': ^1.2.4
  '@shikijs/vitepress-twoslash': ^4.4.2
  '@types/node': ^26.2.0
  '@unocss/reset': ^66.7.5
  '@vueuse/core': ^14.4.0
  '@yunyoujun/docs': ^0.1.14
  bumpp: ^12.2.0
  eslint: ^10.8.0
  floating-vue: ^5.2.2
  lint-staged: ^17.3.0
  pinia: ^4.0.2
  publint: ^0.3.23
  simple-git-hooks: ^2.13.1
  tsdown: ^0.22.14
  tsx: ^4.23.9
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.12.0
  typedoc-vitepress-theme: ^1.1.3
  typescript: ^6.0.3
  unocss: ^66.7.5
  unplugin-vue-components: ^32.1.0
  vite: ^8.2.1
  vite-plugin-vue-devtools: ^8.2.1
  vitepress: ^2.0.0-alpha.19
  vitepress-plugin-group-icons: ^1.7.6
  vitest: ^4.1.10
  vue: ^3.5.41
