ignoreWorkspaceRootCheck: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - apps/*
  - playground
  - docs
  - packages/*
  - examples/*

overrides:
  esbuild: ^0.28.1
  nanoid@<3.3.18: 3.3.18

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@antfu/ni': ^30.6.0
  '@antfu/utils': ^9.3.0
  '@iconify-json/svg-spinners': ^1.2.4
  '@shikijs/vitepress-twoslash': ^4.5.0
  '@types/node': ^26.6.4
  '@unocss/reset': ^66.10.5
  '@vueuse/core': ^15.0.0
  '@yunyoujun/docs': ^0.1.14
  bumpp: ^12.3.0
  eslint: ^10.12.0
  floating-vue: ^5.4.0
  lint-staged: ^17.6.0
  pinia: ^4.0.3
  publint: ^0.3.25
  simple-git-hooks: ^2.14.0
  tsdown: ^0.23.0
  tsx: ^4.23.15
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.13.1
  typedoc-vitepress-theme: ^1.1.4
  typescript: ^6.0.3
  unocss: ^66.10.5
  unplugin-vue-components: ^32.1.0
  vite: ^8.3.2
  vite-plugin-vue-devtools: ^8.2.1
  vitepress: 2.0.0-alpha.20
  vitepress-plugin-group-icons: ^1.7.6
  vitest: ^5.0.3
  vue: ^3.5.43
